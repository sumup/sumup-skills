name: Sync Agent Skills Discovery

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "LICENSE"
      - ".github/workflows/sync-agent-skills-discovery.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sumup-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sumup-skills

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SUMUP_BOT_APP_ID }}
          private-key: ${{ secrets.SUMUP_BOT_PRIVATE_KEY }}
          owner: sumup
          repositories: sumup-developer

      - name: Checkout sumup-developer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sumup/sumup-developer
          path: sumup-developer
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sumup-developer/.nvmrc

      - name: Setup npm
        working-directory: sumup-developer
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        working-directory: sumup-developer
        run: npm ci

      - name: Sync pinned skills
        working-directory: sumup-developer
        env:
          SKILLS_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "agent-skills.source.json";
          const source = JSON.parse(readFileSync(path, "utf8"));
          source.revision = process.env.SKILLS_REVISION;
          writeFileSync(path, `${JSON.stringify(source, null, 2)}\n`);
          JS
          npm run sync:agent-skills -- --source ../sumup-skills
          # Nimbus generates discovery from skills/; remove legacy static files.
          rm -rf public/.well-known/agent-skills

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: sumup-developer
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/sync-agent-skills-discovery
          delete-branch: true
          add-paths: |
            agent-skills.source.json
            skills/
            public/.well-known/
          title: "chore: sync agent skills"
          commit-message: "chore: sync agent skills"
          body: |
            Updates the pinned source revision and imported `skills/` snapshot from
            `sumup/sumup-skills` using the portal's sync script.

            Nimbus generates `/.well-known/agent-skills/index.json` and skill
            archives during the portal build. Legacy static discovery artifacts
            are removed so they cannot conflict with Nimbus's generated files.
